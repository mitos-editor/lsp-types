name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        rust: ["1.85.0", stable, nightly]
        features: ["", proposed]

    env:
      CARGO_INCREMENTAL: 0 # Incremental compilation is slower and bloats the cache
      RUST_BACKTRACE: 1

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test --features "${{ matrix.features }}"

  minimal-dependencies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.85.0"

    - name: Resolve minimum direct dependencies
      run: cargo +nightly generate-lockfile -Z direct-minimal-versions

    - name: Run tests
      run: |
        cargo test --locked
        cargo test --locked --all-features
